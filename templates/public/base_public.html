{% load static %}<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Yurtora CRM{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ ASSET_VERSION }}">
    <style>
        body { margin: 0; background: #f1f3f8; color: #161a2e; font-family: "Barlow", system-ui, sans-serif; }
        .pub-wrap { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
        .pub-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .5rem 0 2rem; }
        .pub-logo { display: inline-flex; align-items: center; gap: .6rem; color: inherit; text-decoration: none; font: italic 800 1.6rem/1 "Barlow Condensed", sans-serif; letter-spacing: .02em; }
        .pub-logo b { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: .55rem; background: #161a2e; color: #fff; font-size: 1.5rem; }
        .pub-btn { display: inline-flex; align-items: center; justify-content: center; padding: .7rem 1.2rem; border-radius: .55rem; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; font-size: 1rem; }
        .pub-btn--main { background: #e62429; color: #fff; }
        .pub-btn--main:hover { background: #b5121b; }
        .pub-card { background: #fff; border: 1px solid #e3e6ee; border-radius: .9rem; padding: 1.5rem; }
        .pub-input { width: 100%; box-sizing: border-box; padding: .65rem .8rem; border: 1px solid #cfd4e0; border-radius: .5rem; font: inherit; font-size: 1rem; background: #fff; }
        .pub-input:focus { outline: 2px solid #161a2e; outline-offset: 1px; }
        .pub-field { display: grid; gap: .3rem; }
        .pub-field label { font-size: .9rem; font-weight: 600; }
        .pub-help { font-size: .82rem; color: #5b6177; }
        .pub-error { font-size: .85rem; color: #b5121b; font-weight: 600; }
        .pub-foot { margin-top: 3rem; font-size: .85rem; color: #5b6177; }
    </style>
</head>
<body>
<div class="pub-wrap">
    <header class="pub-top">
        <a href="/" class="pub-logo"><b>Y</b>Yurtora CRM</a>
        {% block top_action %}<a href="{% url 'public:signup' %}" class="pub-btn pub-btn--main">Markazni ulash</a>{% endblock %}
    </header>
    {% block content %}{% endblock %}
    <footer class="pub-foot">Yurtora, {% now "Y" %}</footer>
</div>
</body>
</html>
