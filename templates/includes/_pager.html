{% if is_paginated %}
<div class="flex items-center justify-between text-sm py-2">
    {% if page_obj.has_previous %}<a class="text-indigo-600 hover:underline" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">&larr; Oldingi</a>{% else %}<span></span>{% endif %}
    <span class="text-slate-500">{{ page_obj.start_index }}–{{ page_obj.end_index }} / {{ paginator.count }} &middot; sahifa {{ page_obj.number }} / {{ paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="text-indigo-600 hover:underline" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Keyingi &rarr;</a>{% else %}<span></span>{% endif %}
</div>
{% endif %}
