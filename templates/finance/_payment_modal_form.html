{% load mv %}
<div class="mv-pay-student">{{ student.full_name }}</div>
{% if items %}
<form method="post" action="{% url 'finance:payment_add' %}" class="mv-pay-form" data-once>
    {% csrf_token %}
    <input type="hidden" name="student_id" value="{{ student.pk }}">
    <input type="hidden" name="idempotency_key" value="{% idem_key %}">
    <input type="hidden" name="next" value="{{ next_url }}">

    <label>Guruh
        <select name="group_id" required>
            {% for item in items %}
            <option value="{{ item.group.pk }}" data-debt-first="{% if item.debt_months %}{{ item.debt_months.0.value }}{% endif %}" data-debt-hint="{% for m in item.debt_months %}{{ m.label }}: {{ m.amount|som }} so'm{% if not forloop.last %}; {% endif %}{% endfor %}">{{ item.group.name }} ({{ item.status }}) — balans: {{ item.balance|som }} so'm</option>
            {% endfor %}
        </select>
    </label>

    <label>Qaysi oy uchun
        <select name="period" data-pay-period>
            {% for o in period_options %}<option value="{{ o.value }}"{% if o.value == default_period %} selected{% endif %}>{{ o.label }}</option>{% endfor %}
        </select>
        <small class="mv-pay-hint" data-pay-hint>{% with first=items.0 %}{% if first.debt_months %}Qarz oylari: {% for m in first.debt_months %}{{ m.label }}: {{ m.amount|som }} so'm{% if not forloop.last %}; {% endif %}{% endfor %}{% endif %}{% endwith %}</small>
    </label>

    <label>Summa (so'm)
        <input type="text" inputmode="numeric" autocomplete="off" data-money name="amount" required placeholder="Masalan: 500 000">
    </label>

    <label>To'lov usuli
        <select name="method" required>
            {% for value, label in methods %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Sana
        <input type="date" name="entry_date" value="{{ today|date:'Y-m-d' }}" required>
    </label>

    <label>Izoh
        <textarea name="comment" rows="2" placeholder="Ixtiyoriy izoh..."></textarea>
    </label>

    <div class="mv-pay-actions">
        <button type="submit" name="action" value="print" class="mv-pay-submit">
            <svg class="mv-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>
            Saqlash va chek chiqarish
        </button>
        <button type="submit" name="action" value="save" class="mv-pay-save">Faqat saqlash</button>
    </div>
</form>
{% else %}
<p class="mv-pay-empty">O'quvchi hech bir guruhga a'zo emas. Avval guruhga qo'shing.</p>
{% endif %}
