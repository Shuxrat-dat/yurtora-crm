name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yurtora_crm
          POSTGRES_USER: yurtora_user
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yurtora_user -d yurtora_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DATABASE_URL: postgres://yurtora_user:ci-password@localhost:5432/yurtora_crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Известные уязвимости зависимостей (PyPI Advisory DB): сборка падает, если нашлись
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # Haqiqiy PostgreSQL'da, shu jumladan parallel hisoblash testlari (SQLite'da o'tkazib yuboriladi)
      - run: pytest
