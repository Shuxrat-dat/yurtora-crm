# Production: docker compose -f docker-compose.prod.yml up -d --build
# Oldindan .env faylida bo'lishi shart: DEBUG=False, kuchli SECRET_KEY, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS,
# POSTGRES_PASSWORD (faqat harf/raqam — DATABASE_URL ichida ishlatiladi) va ROOT_DOMAIN (masalan yurtora.uz).
# HTTPS ni `proxy` xizmati (Caddy) tugatadi: sertifikatni o'zi oladi va yangilaydi. 80 va 443 portlar ochiq bo'lishi kerak.
# Yig'ish: faqat toza `git clone` dan (ishchi papkadagi tugallanmagan fayllar obrazga tushmasligi uchun).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: yurtora_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yurtora_crm}
      POSTGRES_USER: ${POSTGRES_USER:-yurtora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zadayte POSTGRES_PASSWORD v faile .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  web:
    build: .
    container_name: yurtora_crm_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
             --access-logfile - --error-logfile -"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      # Docker tarmog'ida baza "db" nomi bilan topiladi (.env dagi localhost ni almashtiradi)
      DATABASE_URL: postgres://${POSTGRES_USER:-yurtora_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yurtora_crm}
    ports:
      - "127.0.0.1:8000:8000"  # faqat localhost: tashqariga `proxy` orqali chiqariladi
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  proxy:
    image: caddy:2-alpine
    container_name: yurtora_crm_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

  bot:
    build: .
    container_name: yurtora_crm_bot
    restart: unless-stopped
    command: python manage.py run_telegram_bot
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-yurtora_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yurtora_crm}
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    container_name: yurtora_crm_backup
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yurtora_crm}
      POSTGRES_USER: ${POSTGRES_USER:-yurtora_user}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Serverdan tashqariga nusxa: BACKUP_COPY_DIR=/offsite va BACKUP_COPY_HOST_DIR=<ikkinchi disk/NAS papkasi>
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/restore_check.sh:/scripts/restore_check.sh:ro
      - ./backups:/backups
      - ${BACKUP_COPY_HOST_DIR:-./backups-offsite}:/offsite
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Oxirgi muvaffaqiyatli zaxira 36 soatdan eski bo'lsa konteyner "unhealthy" bo'ladi (docker ps da ko'rinadi)
      test: ["CMD-SHELL", "test -f /backups/LAST_OK && [ $$(( $$(date +%s) - $$(stat -c %Y /backups/LAST_OK) )) -lt 129600 ]"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 15m
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
